name: Build NAFEES AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
     
      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
            - name: Generate Android app icon    
          run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cp public/nafees-ai-icon.png assets/icon.png
          npx capacitor-assets generate --android
      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          p.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android
      
