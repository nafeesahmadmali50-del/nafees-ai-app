    <script>
      // Suppress Vite HMR WebSocket connection errors as per AI Studio runtime environment rules ("HMR: Disabled. Ignore WebSocket errors.")
      (function() {
        function isHmrError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || '')) + '';
          var stack = (err && err.stack ? err.stack : '') + '';
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isHmrError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isHmrError(event.message) || isHmrError(event.error)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
